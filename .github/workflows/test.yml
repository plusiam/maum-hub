# 푸시마다 캔버스 줄바꿈 로직 스모크 테스트를 실행하는 워크플로
name: 테스트

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 캔버스 줄바꿈 스모크 테스트
        run: node tests/breaklines.test.js
